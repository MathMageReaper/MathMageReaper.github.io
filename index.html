
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2874f0;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #222;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        h2 {
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .product {
            background-color: white;
            width: 200px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ccc;
        }

        .product img {
            width: 150px;
            height: 120px;
            object-fit: contain;
        }

        button {
            background-color: #ff9f00;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #e68a00;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Shopping Portal</h1>
        <p>Your one-stop online shopping destination!</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
        <a href="#cart">Cart</a>
    </nav>

    <h2 id="products">Our Products</h2>

    <div class="products">

        <div class="product">
            <img src="https://placehold.co/150x120?text=Headphones"
                 alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹999</p>
            <button onclick="addToCart('Headphones', 999)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://placehold.co/150x120?text=Shoes"
                 alt="Shoes">
            <h3>Sports Shoes</h3>
            <p>Price: ₹1,499</p>
            <button onclick="addToCart('Sports Shoes', 1499)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://placehold.co/150x120?text=Watch"
                 alt="Watch">
            <h3>Wrist Watch</h3>
            <p>Price: ₹799</p>
            <button onclick="addToCart('Wrist Watch', 799)">
                Add to Cart
            </button>
        </div>

    </div>

    <h2 id="cart">Shopping Cart</h2>

    <p id="cartItems" style="text-align:center;">
        Your cart is empty.
    </p>

    <p id="total" style="text-align:center;">
        Total: ₹0
    </p>

    <footer id="contact">
        <p>Contact: support@myshopping.com</p>
        <p>&copy; 2026 My Shopping Portal</p>
    </footer>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({ name: name, price: price });
            total += price;

            document.getElementById("cartItems").innerHTML =
                cart.map(item =>
                    item.name + " - ₹" + item.price
                ).join("<br>");

            document.getElementById("total").textContent =
                "Total: ₹" + total;
        }
    </script>

</body>
</html>
